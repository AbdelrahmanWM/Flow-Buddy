[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/AbdelrahmanWM/Flow-Buddy"

[workspace.dependencies]
flowbuddy-core = { path = "crates/core" }
flowbuddy-store = { path = "crates/store" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

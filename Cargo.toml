[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AbdelrahmanWM/Flow-Buddy"

[workspace.dependencies]
flowbuddy-core = { path = "crates/core" }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

name: Release

# Push a tag like v0.1.0: both binaries are built for Linux x86_64 and
# aarch64, packed with everything scripts/install.sh needs, and published
# as a release with the CHANGELOG's notes. Installing from it needs no Rust.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches every piece's version
        run: scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev
      - run: cargo build --release --locked -p flowbuddy-daemon -p flowbuddy-cli --features flowbuddy-daemon/xkb
      - name: Pack
        run: |
          name=flowbuddy-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}
          mkdir -p "dist/$name/bin"
          git archive HEAD gnome-extension vim-plugin vscode-extension shell scripts packaging docs \
            README.md LICENSE CHANGELOG.md | tar -x -C "dist/$name"
          install -m755 target/release/flowbuddyd target/release/flowbuddy "dist/$name/bin/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from the CHANGELOG
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $version" >&2; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Flow Buddy $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

[package]
name = "flowbuddy-daemon"
description = "Flow Buddy background daemon: capture, context, rules, nudges"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "flowbuddyd"
path = "src/main.rs"

[dependencies]
flowbuddy-core.workspace = true
flowbuddy-store.workspace = true
clap.workspace = true
evdev = { version = "0.13", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time", "io-util", "fs"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3.34"
serde_json.workspace = true
serde.workspace = true
xkbcommon = { version = "0.9", default-features = false, optional = true }
x11rb = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", features = ["stream"] }

[lints]
workspace = true

[features]
xkb = ["dep:xkbcommon"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Check the libxkbcommon keymap
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev
          cargo clippy -p flowbuddy-daemon --features xkb --all-targets
          cargo test -p flowbuddy-daemon --features xkb
      - name: Test the VS Code companion's motion facts
        run: |
          sudo apt-get install -yq gjs
          gjs vscode-extension/test/facts.test.js
          gjs vscode-extension/test/textguard.test.js && gjs vscode-extension/test/tools.test.js && gjs vscode-extension/test/tips.test.js
      - name: Test the GNOME extension's tip markup
        run: gjs -m gnome-extension/test/markup.test.js && gjs -m gnome-extension/test/settings-model.test.js && gjs -m gnome-extension/test/placement.test.js
      - name: Test the settings window's tour in a real GTK window (off screen)
        run: |
          sudo apt-get install -yq gir1.2-adw-1 libgtk-4-bin
          cargo build -p flowbuddy-cli
          gnome-extension/test/prefs-tour.sh target/debug/flowbuddy
      - name: Test the Vim plugin's motion facts
        run: |
          command -v vim >/dev/null || sudo apt-get install -yq vim
          vim-plugin/test/run.sh
      - name: Test the plugin in Neovim
        run: |
          sudo apt-get install -yq neovim
          nvim --version | head -1
          vim-plugin/test/run.sh nvim
      - name: Test the shell hooks (bash, zsh, fish)
        run: |
          sudo apt-get install -yq zsh fish
          shell/test/run.sh
      - name: Check shell scripts
        run: |
          for f in shell/flowbuddy.bash shell/test/run.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck shell/flowbuddy.bash shell/test/run.sh scripts/*.sh

  # macOS: editor-only (no keyboard reading). The daemon, the CLI and the
  # Vim plugin, as the Marketplace and plugin-manager installs use them.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: The daemon runs editor-only and listens where the plugins look
        run: |
          cargo build -p flowbuddy-daemon -p flowbuddy-cli
          unset XDG_RUNTIME_DIR
          target/debug/flowbuddyd --editor-only --exit-when-idle > daemon.log 2>&1 &
          for _ in $(seq 50); do [ -S ~/.local/state/flowbuddy/flowbuddy.sock ] && break; sleep 0.2; done
          cat daemon.log
          test -S ~/.local/state/flowbuddy/flowbuddy.sock
          target/debug/flowbuddy status
          kill %1
      - name: Test the Vim plugin
        run: |
          vim --version | head -1
          vim-plugin/test/run.sh vim

  # The checks that guard what's public: secrets, dependencies, versions.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets anywhere in the history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: The VS Code companion packages for the Marketplace
        run: |
          cp LICENSE vscode-extension/
          cd vscode-extension && npx --yes @vscode/vsce@3 package --no-dependencies --allow-missing-repository
      - name: Every piece says the same version
        run: scripts/check-versions.sh

  # The oldest Rust that builds it, from Cargo.toml's rust-version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "msrv=$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
        id: v
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.v.outputs.msrv }}
      - run: cargo build --locked --workspace
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.v.outputs.msrv }}

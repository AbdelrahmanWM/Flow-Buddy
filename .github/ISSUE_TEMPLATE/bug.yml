name: Bug
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to make it happen
      placeholder: "1. Open Vim in GNOME Terminal\n2. …"
  - type: textarea
    attributes:
      label: flowbuddy doctor --report
      description: Paste its output. It has versions, your desktop and the checks, and nothing you typed, no file names and no paths.
      render: markdown
    validations:
      required: true
